name: Discord Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secret
        run: |
          echo "Token length: ${#TOKEN}"
          if [ ${#TOKEN} -lt 50 ]; then
            echo "ERROR: Token is empty or too short"
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}

      - name: Run Discord bot
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python bot.py
